# MAINTAINED BY: SHIVAM
#################################################
name: PR Pipeline
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
      - release/*
      - hotfix/*
      - fix/*
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'
      - '*.md'

env:
  IMAGE_NAME: pharmaco-temp
  IMAGE_TAG: v1.${{ github.run_number }}
  DOCKERHUB_USERNAME: shiva9921
  QUALITY_GATE_ENABLED: true
  QUALITY_GATE_THRESHOLD: 7.0
  TRIVY_SEVERITY: 'CRITICAL,HIGH'

jobs:
  code-quality:
    name: Code Quality Checks
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pylint
        if: env.QUALITY_GATE_ENABLED == 'true'
        run: |
          pip install pylint
          pylint --output-format=json *.py > pylint_results.json || true
          pylint *.py | tee pylint_output.txt
          grep -oP 'rated at \K\d+\.\d+' pylint_output.txt > rating.txt

      - name: Quality Gate Check
        if: env.QUALITY_GATE_ENABLED == 'true'
        id: quality-gate
        run: |
          rating=$(cat rating.txt)
          echo "Code rating: $rating"
          if (( $(echo "$rating >= $QUALITY_GATE_THRESHOLD" | bc -l) )); then
            echo "PASSED=true" >> $GITHUB_OUTPUT
            echo -e "### ✅ Code Quality Gate Passed\n**Rating:** $rating (Threshold: $QUALITY_GATE_THRESHOLD)" >> $GITHUB_STEP_SUMMARY
          else
            echo "PASSED=false" >> $GITHUB_OUTPUT
            echo -e "### ❌ Code Quality Gate Failed\n**Rating:** $rating (Threshold: $QUALITY_GATE_THRESHOLD)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Pylint results
        if: always() && env.QUALITY_GATE_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pylint-results
          path: |
            pylint_results.json
            pylint_output.txt

  build-and-scan:
    name: Build and Security Scan
    needs: code-quality
    permissions:
      contents: read
      packages: write
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --tag ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            .
          echo -e "### 🐳 Docker Image Built\n**Tags:**\n- ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\n- ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        id: trivy-scan
        with:
          image-ref: '${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate Trivy report
        run: |
          trivy image \
            --format table \
            --severity ${{ env.TRIVY_SEVERITY }} \
            --ignore-unfixed \
            --no-progress \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} > trivy-report.txt
          
          echo -e "### 🔍 Security Scan Results\n<details>\n<summary>Vulnerability Report</summary>\n\n" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "\n</details>" >> $GITHUB_STEP_SUMMARY

      - name: Push to Docker Hub (on main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          echo -e "### 📦 Image Pushed to Docker Hub\nSuccessfully pushed both versioned and latest tags" >> $GITHUB_STEP_SUMMARY