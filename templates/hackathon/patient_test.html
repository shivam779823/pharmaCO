<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task For Patient</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .question {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .choices {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .choices button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
        .choices button:hover {
            background-color: #0056b3;
        }
        #progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .result {
            text-align: left;
            margin-top: 20px;
            display: none;
        }
        .result h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .result .summary {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .result .details {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        .details p {
            margin: 5px 0;
        }
        .progress-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 4px;
            height: 20px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background-color: #28a745;
            height: 100%;
            width: 0%; /* Initially set to 0% */
            transition: width 0.3s ease-in-out;
        }
        .btn-exit {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        .btn-exit:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Patient Questionarie</h1>
        <div id="game">
            <div id="progress"></div>
            <div class="progress-bar">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <div class="question" id="question"></div>
            <div class="choices" id="choices"></div>
        </div>
        <div class="result" id="result">
            <div class="summary">
                <h2>Result Summary</h2>
                <p>Your total score: <span id="score"></span></p>
                <p>Impairment level: <span id="impairment"></span></p>
            </div>
            <div class="details">
                <h2>Details</h2>
                <p>Here are some details related to your cognitive impairment:</p>
                <ul id="detailsList"></ul>
            </div>
        </div>
        <button class="btn-exit" onclick="exitGame()">Exit</button>
    </div>
    <script>
        const questions = [
            {
                text: "Do you have trouble remembering recent events or conversations?",
                choices: [
                    { text: "Yes", score: 1 },
                    { text: "No", score: 0 }
                ]
            },
            {
                text: "Do you find it hard to follow TV programs or conversations?",
                choices: [
                    { text: "Yes", score: 1 },
                    { text: "No", score: 0 }
                ]
            },
            {
                text: "Are you having trouble finding your way around familiar environments?",
                choices: [
                    { text: "Yes", score: 1 },
                    { text: "No", score: 0 }
                ]
            },
            {
                text: "Do you struggle to remember the names of close family members or friends?",
                choices: [
                    { text: "Yes", score: 1 },
                    { text: "No", score: 0 }
                ]
            },
            {
                text: "Have you had difficulty performing familiar tasks, such as cooking a meal or paying bills?",
                choices: [
                    { text: "Yes", score: 1 },
                    { text: "No", score: 0 }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let totalScore = 0;

        function loadQuestion() {
            const questionElement = document.getElementById('question');
            const choicesElement = document.getElementById('choices');
            const progressBarFill = document.getElementById('progress-bar-fill');
            const progressElement = document.getElementById('progress');

            const currentQuestion = questions[currentQuestionIndex];

            // Update progress bar
            const progressPercent = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressBarFill.style.width = `${progressPercent}%`;

            progressElement.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            questionElement.textContent = currentQuestion.text;
            choicesElement.innerHTML = '';

            currentQuestion.choices.forEach(choice => {
                const button = document.createElement('button');
                button.textContent = choice.text;
                button.onclick = () => selectChoice(choice.score);
                button.classList.add('btn-option');
                choicesElement.appendChild(button);
            });
        }

        function selectChoice(score) {
            totalScore += score;
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const gameElement = document.getElementById('game');
            const resultElement = document.getElementById('result');
            const scoreElement = document.getElementById('score');
            const impairmentElement = document.getElementById('impairment');
            const detailsList = document.getElementById('detailsList');

            let resultText = '';
            if (totalScore <= 1) {
                resultText = 'Low likelihood of dementia.';
            } else if (totalScore <= 3) {
                resultText = 'Mild cognitive impairment, consider consulting a doctor.';
            } else if (totalScore <= 5) {
                resultText = 'Moderate cognitive impairment, seek medical advice.';
            } else {
                resultText = 'Severe cognitive impairment, urgent medical attention needed.';
            }

            gameElement.style.display = 'none';
            resultElement.style.display = 'block';
            scoreElement.textContent = totalScore;
            impairmentElement.textContent = resultText;

            // Display details based on score (optional)
            detailsList.innerHTML = '';
        }

        function exitGame() {
            window.location.reload(); // Reloads the page to restart the game
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
